name: CI

# Deterministic merge gate: enforce the pseudonymous Identity Policy on every
# commit, then run the static release-surface audit (identity and path-leak
# checks on file contents) and the headless unit/integration suite. This is
# the check that should be required on pull requests into develop and main.

on:
  push:
    branches: [main, develop, "feature/**", "agent/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Identity + static audit + headless tests
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.6.3"
      # Pinned sha256 of Godot_v4.6.3-stable_linux.x86_64.zip (the exact
      # asset the URL below points to). Verified by the maintainer via
      # trust-on-first-use: the zip was downloaded and checked against
      # Godot's official SHA512-SUMS.txt, then hashed with sha256. See the
      # download step for why this isn't left unverified. Bump the version
      # and checksum together, deliberately.
      GODOT_ZIP_SHA256: "d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Enforce develop-to-main promotion flow
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$BASE_BRANCH" = "main" ] && [ "$HEAD_BRANCH" != "develop" ]; then
            echo "Pull requests into main must come from develop; feature branches target develop." >&2
            exit 1
          fi

      - name: Enforce commit identity (pseudonym only)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # This is the only path that enables the checker's narrowly scoped
          # automation identity. A branch name alone is never sufficient.
          ALLOW_DEPENDABOT: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/') && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA" | tail -1)"
          fi
          identity_args=()
          if [ "$ALLOW_DEPENDABOT" = "true" ]; then
            identity_args+=(--allow-dependabot)
          fi
          bash scripts/dev/check_commit_identity.sh "${BASE_SHA}..${HEAD_SHA}" "${identity_args[@]}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Cache Godot ${{ env.GODOT_VERSION }}
        id: cache-godot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-headless

      - name: Download Godot ${{ env.GODOT_VERSION }} (headless)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fL -o godot.zip "${base}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          # Verify integrity before running the binary (same rationale as the
          # rcodesign pin in release.yml): this executable runs our test
          # suite with repo access, so a corrupted or tampered download must
          # fail the build, not silently execute.
          echo "${GODOT_ZIP_SHA256}  godot.zip" | sha256sum -c -
          unzip -o godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

      - name: Import assets
        run: |
          # No `|| true`: a failed import (e.g. the bundled Noto fallback
          # fonts) must fail the build, not silently ship tofu.
          "$HOME/godot/godot" --headless --path . --import

      - name: Static audit + test suite
        run: |
          GODOT="$HOME/godot/godot" ./run-tests.sh
