name: CI

# Deterministic merge gate: enforce the pseudonymous Identity Policy on every
# commit, then run the static release-surface audit (identity and path-leak
# checks on file contents) and the headless unit/integration suite. This is
# the check that should be required on pull requests into develop and main.

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Identity + static audit + headless tests
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.6.3"
      # Verified sha256 of the editor zip below (computed from a direct
      # download of the same release asset). Pinned rather than trusted
      # blindly: this binary imports assets and runs the test suite in CI,
      # so an unverified download is a supply-chain risk on the exact same
      # footing as the rcodesign pin in release.yml. Bump deliberately when
      # GODOT_VERSION changes -- download the new asset, inspect it, compute
      # its sha256.
      GODOT_ZIP_SHA256: "d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Enforce commit identity (pseudonym only)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA" | tail -1)"
          fi
          bash scripts/dev/check_commit_identity.sh "${BASE_SHA}..${HEAD_SHA}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Cache Godot ${{ env.GODOT_VERSION }}
        id: cache-godot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-headless

      - name: Download Godot ${{ env.GODOT_VERSION }} (headless)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fL -o godot.zip "${base}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "${GODOT_ZIP_SHA256}  godot.zip" | sha256sum -c -
          unzip -o godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

      - name: Import assets
        run: |
          "$HOME/godot/godot" --headless --path . --import || true

      - name: Static audit + test suite
        run: |
          GODOT="$HOME/godot/godot" ./run-tests.sh
